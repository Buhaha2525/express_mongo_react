# Chemin typique sur macOS: /usr/local/etc/prometheus.yml
# Ou où vous avez installé Prometheus

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'nodejs-backend'
    static_configs:
      - targets: ['localhost:5001']  # Votre backend Express
    metrics_path: '/metrics'
    scrape_interval: 10s

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']